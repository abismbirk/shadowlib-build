name: Build ShadowLib
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: nttld/setup-ndk@v1
      with: { ndk-version: r25b }
    - run: |
        $ANDROID_NDK_HOME/ndk-build -C app/src/main/jni
        mkdir -p output
        cp -r app/src/main/libs output/
        cp $ANDROID_NDK_HOME/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so output/libs/arm64-v8a/
    - uses: actions/upload-artifact@v4
      with: { name: ShadowLib, path: output }
